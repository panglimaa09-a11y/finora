<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <title>FINORA — Real Wallet</title>
    <link rel="stylesheet" href="/src/dapin-credit.css" />
    <link rel="stylesheet" href="/src/dapin-loan-credit.css" />
    <link rel="stylesheet" href="/src/dapin-mobile.css?v=297dafa8" />
    <link rel="stylesheet" href="/src/mobile-layout-fix.css?v=20260826-04" />
    <link rel="stylesheet" href="/src/mobile-fix.css?v=20260826-05" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
    <script type="module" src="/src/dapin-credit.js"></script>
    <script type="module" src="/src/dapin-loan-credit.js"></script>
    <script type="module" src="/src/withdraw-enhancer.js"></script>
    <script type="module" src="/src/dapin-graphs.js?v=20260826-03"></script>
    <script type="module" src="/src/admin-center.js?v=20260826-01"></script>
    <script>
      (() => {
        const init = () => {
          const shell = document.querySelector('.dapin-admin-shell, .dapin-shell, .dapin-app');
          const sidebar = document.querySelector('.dapin-admin-sidebar, .dapin-sidebar');
          if (shell && sidebar && !sidebar.dataset.mobileBound) {
            sidebar.dataset.mobileBound = '1';
            const toggle = shell.querySelector('[data-dapin-toggle]');
            const close = () => { sidebar.classList.remove('is-open'); shell.classList.remove('sidebar-open', 'dapin-menu-open'); };
            if (toggle) toggle.addEventListener('click', (e) => {
              e.preventDefault();
              const open = !sidebar.classList.contains('is-open');
              sidebar.classList.toggle('is-open', open);
              shell.classList.toggle('sidebar-open', open);
              shell.classList.toggle('dapin-menu-open', open);
            });
            sidebar.addEventListener('click', e => { if (e.target.closest('.dapin-nav')) setTimeout(close, 80); });
          }
        };
        const observer = new MutationObserver(init);
        observer.observe(document.body, { childList: true, subtree: true });
        init();
      })();
    </script>
  </body>
</html>
