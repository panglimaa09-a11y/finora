name: Build FINORA APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Prepare FINORA.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk FINORA.apk

      - name: Upload FINORA.apk
        uses: actions/upload-artifact@v4
        with:
          name: FINORA-APK
          path: FINORA.apk
          if-no-files-found: error
