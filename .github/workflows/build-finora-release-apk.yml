name: Build FINORA Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore release keystore
        env:
          FINORA_KEYSTORE_B64: ${{ secrets.FINORA_KEYSTORE_B64 }}
        run: |
          test -n "$FINORA_KEYSTORE_B64"
          echo "$FINORA_KEYSTORE_B64" | base64 --decode > android/finora-release.jks

      - name: Configure Android signing
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FINORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.FINORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.FINORA_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          cat > keystore.properties <<EOF
          storeFile=finora-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build signed Release APK
        working-directory: android
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk FINORA.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: FINORA.apk
          generate_release_notes: true
